name: Build ESP32-P4 Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP-IDF v5.3
        uses: esp-idf/setup-esp-idf@v1
        with:
          version: v5.3

      - name: Set Target to ESP32-P4
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4

      - name: Build Project for ESP32-P4
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
          if-no-files-found: error