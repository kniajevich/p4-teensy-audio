name: ESP-IDF Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set target to ESP32-P4
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
