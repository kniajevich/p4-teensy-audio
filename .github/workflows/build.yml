name: Build ESP32-P4 Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for ESP32-P4
        shell: bash
        run: |
          . /opt/esp/entrypoint.sh
          idf.py set-target esp32p4
          idf.py build